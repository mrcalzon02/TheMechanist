name: Main Java 17 Milestone Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'PACKAGE_launcher/java/**'
      - 'scripts/PACKAGE_CLIENT_WINDOWS.ps1'
      - 'ROOT_docs/**'
      - '.github/workflows/main-java17-milestone-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: main-java17-milestone-gate
  cancel-in-progress: true

jobs:
  compile-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile full Java source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ROOT_build/main-java17-gate
          mkdir -p ROOT_build/main-java17-gate/classes
          find src -name '*.java' -print | sort > ROOT_build/main-java17-gate/sources.txt
          test -s ROOT_build/main-java17-gate/sources.txt
          javac -encoding UTF-8 --release 17 \
            -d ROOT_build/main-java17-gate/classes \
            @ROOT_build/main-java17-gate/sources.txt

      - name: Verify desktop launcher compiles and installed build identity is honest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ROOT_build/main-java17-gate/launcher-classes
          find PACKAGE_launcher/java/src/main/java -name '*.java' -print | sort \
            > ROOT_build/main-java17-gate/launcher-sources.txt
          test -s ROOT_build/main-java17-gate/launcher-sources.txt
          javac -encoding UTF-8 --release 17 \
            -d ROOT_build/main-java17-gate/launcher-classes \
            @ROOT_build/main-java17-gate/launcher-sources.txt
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.BuildIdentityDisplaySmoke
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/launcher-classes \
            mechanist.launcher.LauncherBuildIdentitySmoke
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/launcher-classes:ROOT_build/main-java17-gate/classes \
            mechanist.launcher.LauncherPresentationSmoke --client-integration

      - name: Verify loading, fixture and world rendering
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.EarlyScreenTextAuthoritySmoke
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.PublicFixtureGraphicalBindingSmoke
          java -Djava.awt.headless=true \
            -Dmechanist.storage.root=ROOT_build/main-java17-gate/render-user \
            -Dmechanist.client.storage.root=ROOT_build/main-java17-gate/render-profile \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.DeveloperBattleMapSmoke ROOT_build/main-java17-gate/render-captures

      - name: Verify terrain persistence and failed-save preservation
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.WorldTerrainPersistenceSmoke
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.VisitedWorldPersistenceSmoke
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.CampTravelIntegrationSmoke
          mkdir -p ROOT_build/main-java17-gate/installed-cwd
          cd ROOT_build/main-java17-gate/installed-cwd
          java -Djava.awt.headless=true \
            -Dmechanist.storage.root="$GITHUB_WORKSPACE/ROOT_build/main-java17-gate/storage-user" \
            -cp "$GITHUB_WORKSPACE/ROOT_build/main-java17-gate/classes" \
            mechanist.InstalledUserStorageSmoke
          test -z "$(find . -type f -print -quit)"

      - name: Run focused semantic resolver smoke
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone02SemanticRenderAssetResolverSmoke

      - name: Run focused semantic runtime bridge smoke
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone02SemanticRuntimeIntentBridgeSmoke
          # Asset IDs for tile types are immutable for one installed registry;
          # explicitly swapping art must rebuild precisely one new catalog.
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.TileSemanticRuntimeRegistrySmoke

      - name: Run semantic coverage smoke
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone02SemanticAssetMigrationCoverageSmoke

      - name: Verify deterministic NPC continuity and physical vehicle strategy
        shell: bash
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.NpcContinuityDeterminismSmoke
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06VehicleRuntimeFoundationSmoke
          # Canonical garage staging and maintenance must run before the
          # bounded legacy Gate 3 diagnostics can time out.
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06VehicleMaintenanceSmoke
          # Vehicle transit is also exercised independently, because the
          # comprehensive legacy Gate 3 suite may time out before reaching it.
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06VehicleTransitSmoke
          # Vehicle manifests must preserve row identity and capacity even for
          # delimiter-bearing names and malformed legacy stock ledgers.
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06VehicleManifestSmoke
          # Strategic booking terms and replay safety must be checked before
          # optional full-world diagnostics consume their bounded time window.
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06VehicleStrategicTransitSmoke
          # Faction motor-pool cancellation must be tested with the same
          # title and site controls as player-owned strategic reservations.
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06FactionVehicleRouteControlSmoke
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06FactionVehicleStrategicRouteControlSmoke
          # Directly verify live dashboard fuel/reservation clarity before
          # optional worldgen diagnostics can exhaust their time budget.
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06VehicleDashboardSmoke
          # Check saved-world historical ledgers before the optional full-world
          # generation diagnostics can consume their 120-second budget.
          java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Milestone06SavedWorldHistoryContinuitySmoke

      - name: Verify world-actor sprite intake without placeholder assets
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s java -Djava.awt.headless=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.WorldActorSpriteResolverSmoke

      - name: Record source-build Java classfile ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct

          root = Path('ROOT_build/main-java17-gate/classes')
          files = sorted(root.rglob('*.class'))
          if not files:
              raise SystemExit('No class files were produced.')

          highest = 0
          for path in files:
              with path.open('rb') as handle:
                  magic = handle.read(4)
                  if magic != b'\xca\xfe\xba\xbe':
                      raise SystemExit(f'Invalid classfile magic: {path}')
                  minor, major = struct.unpack('>HH', handle.read(4))
                  highest = max(highest, major)
                  if major > 61:
                      raise SystemExit(f'Classfile exceeds Java 17: {path} major={major}')

          print(f'Java 17 source classfile gate passed: files={len(files)} highestMajor={highest}')
          PY

      - name: Build production client package and jar
        shell: pwsh
        run: |
          ./scripts/PACKAGE_CLIENT_WINDOWS.ps1 `
            -OutputDir 'ROOT_build/main-package-client' `
            -CleanOutput `
            -CleanClasses `
            -BuildJar

      - name: Verify packaged jar and Java 17 classfiles
        shell: bash
        run: |
          set -euo pipefail
          package_root='ROOT_build/main-package-client'
          jar_path="$package_root/TheMechanist.jar"
          test -d "$package_root/classes"
          test -f "$package_root/classes/mechanist/TheMechanist.class"
          test -f "$jar_path"
          jar tf "$jar_path" | grep -Fx 'mechanist/TheMechanist.class'
          unzip -p "$jar_path" META-INF/MANIFEST.MF | grep -F 'Main-Class: mechanist.TheMechanist'

          python - <<'PY'
          from pathlib import Path
          import struct

          root = Path('ROOT_build/main-package-client/classes')
          files = sorted(root.rglob('*.class'))
          if not files:
              raise SystemExit('The production package contained no class files.')

          highest = 0
          for path in files:
              with path.open('rb') as handle:
                  if handle.read(4) != b'\xca\xfe\xba\xbe':
                      raise SystemExit(f'Invalid packaged classfile magic: {path}')
                  minor, major = struct.unpack('>HH', handle.read(4))
                  highest = max(highest, major)
                  if major > 61:
                      raise SystemExit(f'Packaged classfile exceeds Java 17: {path} major={major}')

          print(f'Java 17 package classfile gate passed: files={len(files)} highestMajor={highest}')
          PY

      - name: Boot packaged client for eight seconds
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          package_root="$PWD/ROOT_build/main-package-client"
          stdout="$PWD/ROOT_build/main-package-client-boot.stdout.log"
          stderr="$PWD/ROOT_build/main-package-client-boot.stderr.log"
          set +e
          timeout 8s xvfb-run -a java \
            -Djava.awt.headless=false \
            -Dmechanist.assetRoot="$package_root" \
            -Dmechanist.generatedAssetRoot="$package_root" \
            -Dmechanist.assetTier=low_32 \
            -Dmechanist.assetResolution=32 \
            -cp "$package_root/classes:$package_root" \
            mechanist.TheMechanist \
            >"$stdout" 2>"$stderr"
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo 'Package boot smoke passed: client exited cleanly before the timeout.'
          elif [ "$code" -eq 124 ]; then
            echo 'Package boot smoke passed: client remained alive for the eight-second window.'
          else
            echo "Package boot smoke failed with exit code $code."
            echo '--- stdout ---'
            cat "$stdout" || true
            echo '--- stderr ---'
            cat "$stderr" || true
            exit "$code"
          fi

      # Informational diagnostics may not prevent a compiled, packaged, bootable
      # client from being verified. Bound the old 247-smoke chain so it can never
      # consume the whole release gate's runtime budget.
      - name: Run bounded Gate 3 player-facing diagnostics
        shell: bash
        run: |
          # GitHub's bash runner starts with -e. Explicitly disable errexit
          # while collecting the intentionally non-blocking diagnostic exit.
          set +e
          set -uo pipefail
          stdout="ROOT_build/main-java17-gate/gate3.stdout.log"
          stderr="ROOT_build/main-java17-gate/gate3.stderr.log"
          timeout --signal=QUIT --kill-after=5s 120s java -Djava.awt.headless=true \
            -Dmechanist.profileWorldgen=true -Dmechanist.profileSaveLoad=true \
            -cp ROOT_build/main-java17-gate/classes \
            mechanist.Gate3PlayerFacingTextSmokeSuite >"$stdout" 2>"$stderr"
          code=$?
          echo '--- Save-load / worldgen phase timing readback ---'
          grep -E 'WORLDGEN_PROFILE|SAVE_LOAD_PROFILE' "$stdout" | tail -n 20 || true
          echo '--- Gate 3 recent cases ---'
          tail -n 28 "$stdout" || true
          tail -n 28 "$stderr" || true
          if [ "$code" -eq 0 ]; then
            echo 'Gate 3 diagnostic suite passed.'
            echo '- Gate 3 diagnostic: PASS (bounded to 120s).' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "::warning::Gate 3 diagnostics exceeded 120s; last-started test and JVM SIGQUIT thread dump are in uploaded logs."
            echo '- Gate 3 diagnostic: TIMEOUT (120s), non-blocking; see JVM thread dump and test logs.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Gate 3 diagnostics reported exit code $code; inspect uploaded failure details."
            echo "- Gate 3 diagnostic: FAIL ($code), non-blocking; see uploaded logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Gate 3 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-diagnostics-${{ github.sha }}
          path: ROOT_build/main-java17-gate/gate3.*.log
          if-no-files-found: ignore
          retention-days: 7

  publish-status:
    if: always()
    needs: compile-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Publish connector-visible commit status
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.compile-and-smoke.result }}';
            const passed = result === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'main-java17-milestone-gate',
              description: passed
                ? 'Java 17 compile, smokes, package, jar, and boot passed'
                : `Java 17 milestone gate ${result}`
            });
