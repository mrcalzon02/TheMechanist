name: Verified Installer Lifecycle and Authorized Prerelease

# Installer lifecycle verification is operator-dispatched; packaging success alone
# never authorizes publication while 06.R inventory/clearance is still open.
on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'I reviewed exact-commit release evidence and clearance and authorize public prerelease publication'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mechanist-verified-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-installer-lifecycle:
    name: Build, install, boot, uninstall (Windows and Linux)
    uses: ./.github/workflows/alpha-installer-deployment.yml
    with:
      release_version: ${{ format('0.9.{0}', github.run_number) }}

  publish:
    name: Publish explicitly authorized GitHub prerelease
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_prerelease == true }}
    needs: verify-installer-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out exact source for publication clearance
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require exact-commit inventory and redistribution clearance
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 ROOT_build/ci/run_local_inventory_gate.py \
            --require-release-clearance \
            --output dist/prerelease-inventory \
            --report dist/prerelease-inventory-report.json
          python3 ROOT_build/ci/certify_release_inventory.py \
            --generated-manifest dist/prerelease-inventory/generated.tsv \
            --committed-manifest ROOT_docs/REPOSITORY_FILE_MANIFEST.tsv \
            --clearance-registry ROOT_docs/RELEASE_CLEARANCE.tsv \
            --audit-report dist/prerelease-inventory/release-inventory-report.json \
            --source-commit "$SOURCE_COMMIT" \
            --output dist/prerelease-inventory/certificate.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          commit = os.environ["SOURCE_COMMIT"]
          report = json.loads(Path("dist/prerelease-inventory-report.json").read_text(encoding="utf-8"))
          certificate = json.loads(Path("dist/prerelease-inventory/certificate.json").read_text(encoding="utf-8"))
          if (report.get("status") != "passed"
                  or report.get("commit") != commit
                  or report.get("requireReleaseClearance") is not True
                  or report.get("manifestChanged") is not False):
              raise SystemExit("Publication inventory gate did not pass for the exact commit")
          if (certificate.get("status") != "verified"
                  or certificate.get("sourceCommit") != commit
                  or certificate.get("releaseReady") is not True
                  or type(certificate.get("clearanceRequiredCount")) is not int
                  or certificate["clearanceRequiredCount"] < 1
                  or certificate.get("clearanceApprovedCount") != certificate["clearanceRequiredCount"]):
              raise SystemExit("Publication clearance certificate is not exact and complete")
          PY

      - name: Download lifecycle-certified packages
        uses: actions/download-artifact@v4
        with:
          pattern: Alpha-Installer-Deployment-*
          path: verified
          merge-multiple: false

      - name: Select complete release assets and make checksums
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_number }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil

          evidence = Path("verified")
          output = Path("publish-assets")
          output.mkdir(parents=True, exist_ok=True)
          assets = []
          for pattern, label in (("*.msi", "windows-x64-installer"), ("*.deb", "linux-x64-installer")):
              matches = [p for p in evidence.rglob(pattern) if p.is_file()]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {label}, found {len(matches)}: {matches}")
              source = matches[0]
              if source.stat().st_size <= 1024 * 1024:
                  raise SystemExit(f"Refusing empty/implausibly small package: {source}")
              if source.stat().st_size >= 2 * 1024**3:
                  raise SystemExit(f"GitHub release asset exceeds 2 GiB: {source}")
              destination = output / source.name
              if destination.exists():
                  raise SystemExit(f"Colliding installer asset name: {source.name}")
              shutil.copy2(source, destination)
              digest = hashlib.file_digest(destination.open("rb"), "sha256").hexdigest()
              assets.append({"name": destination.name, "role": label,
                             "size": destination.stat().st_size, "sha256": digest})
          clearance = Path("dist/prerelease-inventory/certificate.json")
          if not clearance.is_file():
              raise SystemExit("Missing exact-commit publication clearance certificate")
          clearance_asset = output / "release-inventory-certificate.json"
          shutil.copy2(clearance, clearance_asset)
          with clearance_asset.open("rb") as stream:
              clearance_hash = hashlib.file_digest(stream, "sha256").hexdigest()
          assets.append({"name": clearance_asset.name, "role": "repository-clearance",
                         "size": clearance_asset.stat().st_size, "sha256": clearance_hash})
          (output / "SHA256SUMS.txt").write_text(
              "".join(f'{a["sha256"]}  {a["name"]}\n' for a in assets), encoding="utf-8"
          )
          (output / "release-metadata.json").write_text(
              json.dumps({"schema": 1, "channel": "alpha", "commit": os.environ["SOURCE_COMMIT"],
                          "run_number": int(os.environ["RELEASE_RUN"]),
                          "run_id": int(os.environ["RELEASE_RUN_ID"]),
                          "version": "0.9." + os.environ["RELEASE_RUN"],
                          "assets": assets}, indent=2) + "\n", encoding="utf-8"
          )
          print("Validated assets:", json.dumps(assets, indent=2))
          PY
          (cd publish-assets && sha256sum -c SHA256SUMS.txt)
          test -s publish-assets/release-metadata.json

      - name: Publish only after Windows and Linux lifecycle gates passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_COMMIT:0:12}"
          tag="auto-${RELEASE_RUN}-${short_sha}"
          notes="Verified installer build for commit ${SOURCE_COMMIT}. Windows MSI and Linux DEB passed the native installer deployment lifecycle gates (build, install, launch, uninstall, and preservation of mutable data). The exact-commit inventory and governed redistribution-clearance checks also passed; their certificate is attached. Verify downloaded files against SHA256SUMS.txt. This is an alpha release; native executables are not Authenticode/code-signed."
          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$REPOSITORY" \
              --target "$SOURCE_COMMIT" --draft --prerelease \
              --title "The Mechanist alpha 0.9.${RELEASE_RUN} (${short_sha})" \
              --notes "$notes"
          fi
          gh release upload "$tag" --repo "$REPOSITORY" --clobber publish-assets/*
          gh release edit "$tag" --repo "$REPOSITORY" --draft=false --prerelease=true
          gh release view "$tag" --repo "$REPOSITORY" --json url,isDraft,assets \
            --jq '{url: .url, draft: .isDraft, assetNames: [.assets[].name]}'
