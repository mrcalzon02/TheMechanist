# The Mechanist client release-obfuscation policy.
#
# Stability is the priority for the limited alpha. This pass obfuscates project
# implementation names without shrinking or optimizing the shaded runtime.
# Relative report paths resolve from the repository root and are never packaged.

-basedirectory ../../
-dontshrink
-dontoptimize
-useuniqueclassmembernames

-keepattributes Exceptions,InnerClasses,EnclosingMethod,Signature,*Annotation*,Record,PermittedSubclasses,MethodParameters
-renamesourcefileattribute SourceFile

-printmapping target/proguard/client/mapping.txt
-printseeds target/proguard/client/seeds.txt

# Every packaged executable and smoke entry is invoked by its exact class name.
-keepclasseswithmembers class * {
    public static void main(java.lang.String[]);
}

# Explicit player-facing entry points and manifest targets.
-keep class mechanist.TheMechanist {
    public static void main(java.lang.String[]);
}
-keep class mechanist.RemoteClientMain {
    public static void main(java.lang.String[]);
}
-keep class mechanist.MechanistServerMain {
    public static void main(java.lang.String[]);
}

# Packaged authority verification reflects these names to enforce the remote
# lobby's deliberately narrow wait-only world-authority boundary. Preserve the
# audited API names so negative structural checks remain meaningful.
-keepclassmembernames class mechanist.IndependentHostLobbyWindow {
    javax.swing.JButton waitTurnButton;
    <methods>;
}
-keepclassmembernames class mechanist.IndependentHostClientSupervisor {
    <methods>;
}
-keepnames class mechanist.SinglePlayerSectorRuntimeBridge

# Runtime editor snapshots expose class and field names as their stable schema.
# Preserve exactly the source types that flow through snapshotEntity.
-keep,allowshrinking,allowoptimization class mechanist.RoomPopulationLedger { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.CrecheCohortRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.EssentialSupplyReserveRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.VerticalTradeReserveRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.SecuritySupplyReserveRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.MedicalSupplyReserveRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.NobleLuxuryReserveRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.DraughtCustodyRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.AnimalAgricultureSupplyReserveRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.RawMaterialSupplyReserveRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.ShipmentProvenanceRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.FactionContract { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.PersonnelReplacementRequest { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.MapObjectState { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.DeferredFactionLedgerRecord { <fields>; }
-keep,allowshrinking,allowoptimization class mechanist.TopDownWorldEventRecord { <fields>; }

# Dynamic compatibility bridges resolve these members from runtime class names.
-keepclassmembernames class mechanist.LegacyImageSurface {
    mechanist.ImageCache media;
}
-keepclassmembernames class mechanist.ImageCache {
    java.util.ArrayList bootFrames;
}
-keepclassmembernames class mechanist.World {
    char[][] tiles;
    int w;
    int h;
}
-keepclassmembernames class mechanist.WorldSetupSettings {
    int zoneSize;
}

# Preserve enum and serializable contracts used by command, roster, save, and UI data.
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
-keepnames class * implements java.io.Serializable
-keepclassmembers class * implements java.io.Serializable {
    private static final long serialVersionUID;
}

# These libraries depend on JNI, service loading, reflection, generated names,
# or externally stable native symbols. They remain intact inside the shaded JAR.
-keep class io.netty.** { *; }
-keep interface io.netty.** { *; }
-keep class org.lwjgl.** { *; }
-keep interface org.lwjgl.** { *; }
-keep class com.studiohartman.jamepad.** { *; }
-keep interface com.studiohartman.jamepad.** { *; }

# Optional platform adapters may be absent from an individual target package.
-dontwarn com.studiohartman.jamepad.**
-dontwarn org.lwjgl.**
-dontwarn io.netty.**
-dontnote
